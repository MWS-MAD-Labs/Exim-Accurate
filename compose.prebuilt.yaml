services:
  app:
    image: ghcr.io/mws-mad-labs/exim-accurate:latest
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5758
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password@postgres:5432/exim_accurate?schema=public}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:5758}
    ports:
      - "5758:5758"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5758').then((response) => process.exit(response.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  allowance-notification-scheduler:
    image: curlimages/curl:8.16.0
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer $${CRON_SECRET}" \
            http://app:5758/api/cron/pos-allowance-notifications || true
          sleep 3600
        done

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: exim_accurate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
