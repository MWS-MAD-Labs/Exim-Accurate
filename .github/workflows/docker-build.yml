name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fix Git Workspace Permissions
        run: git config --global --add safe.directory '*'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Linting & Type Check
        run: npm test

  # The permission list of this version has to reach Central before the new container replaces the old
  # one. If it cannot (Central down, not deployed with the endpoints yet, or it refuses the list) this
  # job fails, the redeploy below does not run, and the version that is running stays as it is.
  sync-permissions:
    name: Send Permission List To Central
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Send permissions
        env:
          CENTRAL_API_BASE_URL: ${{ secrets.CENTRAL_API_BASE_URL }}
          CENTRAL_API_TOKEN: ${{ secrets.CENTRAL_API_TOKEN }}
          # The older secret names still work until they are moved.
          CENTRAL_DATA_API_BASE_URL: ${{ secrets.CENTRAL_DATA_API_BASE_URL }}
          CENTRAL_DATA_API_TOKEN: ${{ secrets.CENTRAL_DATA_API_TOKEN }}
        run: |
          if { [ -z "$CENTRAL_API_BASE_URL" ] || [ -z "$CENTRAL_API_TOKEN" ]; } && { [ -z "$CENTRAL_DATA_API_BASE_URL" ] || [ -z "$CENTRAL_DATA_API_TOKEN" ]; }; then
            echo "::error::CENTRAL_API_BASE_URL and CENTRAL_API_TOKEN secrets are not set."
            exit 1
          fi
          npx tsx scripts/sync-permissions.ts sync --retries 5 --wait 20

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fix Git Workspace Permissions
        run: git config --global --add safe.directory '*'

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  redeploy:
    name: Trigger Komodo Redeploy
    needs: [build-and-push, sync-permissions]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Call Komodo Webhook
        env:
          WEBHOOK_URL: ${{ secrets.KOMODO_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "Error: KOMODO_WEBHOOK_URL secret not found. Manual redeploy required."
            exit 1
          fi

          # Use a minimal payload that mimics a GitHub push event
          PAYLOAD='{"event":"push","ref":"refs/heads/main","repository":{"full_name":"${{ github.repository }}"}}'
          
          if [ -n "$WEBHOOK_SECRET" ]; then
            echo "Triggering signed Komodo redeploy..."
            # HMAC SHA256 signature
            SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')
            curl --fail-with-body --show-error -X POST \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Event: push" \
              -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
              -d "$PAYLOAD" \
              "$WEBHOOK_URL"
          else
            echo "Triggering unsigned Komodo redeploy..."
            curl --fail-with-body --show-error -X POST \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Event: push" \
              -d "$PAYLOAD" \
              "$WEBHOOK_URL"
          fi
